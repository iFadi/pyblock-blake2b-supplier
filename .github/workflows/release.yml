name: Release

on:
  push:
    tags:
      - 'v*.*.*-rev*'

permissions: {}

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Validate release tag against package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/validate-release-tag.js

      - name: Require developer signing key
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          if [[ -z "$DEV_KEY" ]]; then
            echo "::error::The DEV_KEY repository secret is required for releases"
            exit 1
          fi

  release:
    needs: validate-tag
    permissions:
      contents: write
    uses: Start9Labs/start-technologies/.github/workflows/release.yml@f7dcde71be804af424350b48c8b73aba03f41321
    with:
      TAG: ${{ github.ref_name }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}

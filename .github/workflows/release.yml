name: Release

on:
  push:
    tags:
      - 'v*.*.*-rev*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag-shaped version to validate for this non-publishing dry run
        required: true
        default: v1.0.0-rev9
        type: string

permissions: {}

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Validate checked-out commit
        id: source
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EVENT_SHA"
          printf 'sha=%s\n' "$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Validate release tag against package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: node .github/scripts/validate-release-tag.js

  build:
    needs: validate-tag
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86
            runner: ubuntu-24.04
            cli_asset: start-cli_x86_64-linux
            cli_sha256: 830c3b25833fed7cfb16b377172125e35aa75a27a356862776358bd21293023d
            package_name: pyblock-blake2b-supplier_x86_64.s9pk
          - target: arm
            runner: ubuntu-24.04-arm
            cli_asset: start-cli_aarch64-linux
            cli_sha256: 63b067c3491a29bfbcd0424fff4bc04f6baaf501146b55d495563fc9e98cff0f
            package_name: pyblock-blake2b-supplier_aarch64.s9pk
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-tag.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: |
          set -euo pipefail
          grep -rl 'packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            libclang-dev \
            qemu-user-static \
            squashfs-tools-ng

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker with containerd image store
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Verify Docker packaging prerequisites
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          docker info --format '{{json .DriverStatus}}' | grep -Fq 'io.containerd.snapshotter.v1'

      - name: Install verified start-cli v2.0.0
        env:
          START_CLI_ASSET: ${{ matrix.cli_asset }}
          START_CLI_SHA256: ${{ matrix.cli_sha256 }}
          START_CLI_VERSION: 2.0.0
        run: |
          set -euo pipefail
          download_path="$(mktemp)"
          trap 'rm -f "$download_path"' EXIT
          download_url="https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2Fv${START_CLI_VERSION}/${START_CLI_ASSET}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$download_path" "$download_url"
          printf '%s  %s\n' "$START_CLI_SHA256" "$download_path" | sha256sum --check --strict -
          sudo install --mode 0755 "$download_path" /usr/local/bin/start-cli
          start-cli --version

      - name: Install package dependencies
        run: npm ci

      - name: Provision persistent release signing key
        if: ${{ github.event_name == 'push' }}
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$DEV_KEY" ]]; then
            echo "::error::The DEV_KEY repository secret is required for tag releases"
            exit 1
          fi
          mkdir -p "$HOME/.startos" .startos
          printf '%s' "$DEV_KEY" > "$HOME/.startos/id.key.pem"
          cp "$HOME/.startos/id.key.pem" .startos/build.key.pem
          chmod 0600 "$HOME/.startos/id.key.pem" .startos/build.key.pem

      - name: Provision ephemeral dry-run signing key
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          umask 077
          start-cli init-key
          mkdir -p .startos
          cp "$HOME/.startos/id.key.pem" .startos/build.key.pem
          chmod 0600 "$HOME/.startos/id.key.pem" .startos/build.key.pem

      - name: Build package
        env:
          BUILD_TARGET: ${{ matrix.target }}
          EXPECTED_PACKAGE: ${{ matrix.package_name }}
        run: |
          set -euo pipefail
          RUST_LOG=debug RUST_BACKTRACE=1 make "$BUILD_TARGET"
          mapfile -t packages < <(find . -maxdepth 1 -type f -name '*.s9pk' -printf '%f\n' | sort)
          if [[ ${#packages[@]} -ne 1 || "${packages[0]:-}" != "$EXPECTED_PACKAGE" ]]; then
            printf '::error::Expected only %s; found: %s\n' "$EXPECTED_PACKAGE" "${packages[*]:-none}"
            exit 1
          fi
          test -s "$EXPECTED_PACKAGE"
          sha256sum "$EXPECTED_PACKAGE"

      - name: Remove signing key
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -f "$HOME/.startos/id.key.pem" .startos/build.key.pem
          rmdir "$HOME/.startos" .startos 2>/dev/null || true

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-${{ matrix.target }}
          path: ./${{ matrix.package_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    if: ${{ github.event_name == 'push' }}
    needs: [validate-tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out validated tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-tag.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install verified start-cli v2.0.0
        env:
          START_CLI_ASSET: start-cli_x86_64-linux
          START_CLI_SHA256: 830c3b25833fed7cfb16b377172125e35aa75a27a356862776358bd21293023d
          START_CLI_VERSION: 2.0.0
        run: |
          set -euo pipefail
          download_path="$(mktemp)"
          trap 'rm -f "$download_path"' EXIT
          download_url="https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2Fv${START_CLI_VERSION}/${START_CLI_ASSET}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$download_path" "$download_url"
          printf '%s  %s\n' "$START_CLI_SHA256" "$download_path" | sha256sum --check --strict -
          sudo install --mode 0755 "$download_path" /usr/local/bin/start-cli
          start-cli --version

      - name: Collect signed packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: build-*
          merge-multiple: true
          path: release-assets

      - name: Validate packages and prepare release notes
        env:
          EXPECTED_VERSION: 1.0.0:9
          TAGGED_SHA: ${{ needs.validate-tag.outputs.source-sha }}
        run: |
          set -euo pipefail
          cd release-assets

          expected=(
            pyblock-blake2b-supplier_aarch64.s9pk
            pyblock-blake2b-supplier_x86_64.s9pk
          )
          mapfile -t collected < <(find . -maxdepth 1 -type f -name '*.s9pk' -printf '%f\n' | sort)
          if [[ ${#collected[@]} -ne 2 || "${collected[*]}" != "${expected[*]}" ]]; then
            printf '::error::Expected exactly: %s; found: %s\n' "${expected[*]}" "${collected[*]:-none}"
            exit 1
          fi
          if [[ $(find . -mindepth 1 -maxdepth 1 | wc -l) -ne 2 ]]; then
            echo "::error::Unexpected entries were collected with the package artifacts"
            find . -mindepth 1 -maxdepth 1 -printf '%f\n'
            exit 1
          fi

          release_notes=''
          for package in "${expected[@]}"; do
            test -s "$package"
            manifest="$(start-cli s9pk inspect "$package" manifest)"
            version="$(jq --exit-status --raw-output '.version' <<<"$manifest")"
            if [[ "$version" != "$EXPECTED_VERSION" ]]; then
              echo "::error::$package reports version $version, expected $EXPECTED_VERSION"
              exit 1
            fi

            case "$package" in
              *_aarch64.s9pk) expected_arch=aarch64 ;;
              *_x86_64.s9pk) expected_arch=x86_64 ;;
              *) echo "::error::Unexpected package name: $package"; exit 1 ;;
            esac
            arch="$(jq --exit-status --raw-output \
              '[.images[].arch // empty] | flatten | unique | if length == 1 then .[0] else error("expected one architecture") end' \
              <<<"$manifest")"
            if [[ "$arch" != "$expected_arch" ]]; then
              echo "::error::$package reports architecture $arch, expected $expected_arch"
              exit 1
            fi

            git_hash="$(jq --raw-output '.gitHash // empty' <<<"$manifest")"
            if [[ "$git_hash" != "$TAGGED_SHA" ]]; then
              echo "::error::$package reports git hash $git_hash, expected $TAGGED_SHA"
              exit 1
            fi

            notes="$(jq --exit-status --raw-output \
              '.releaseNotes | if type == "object" then (.en_US // first(.[]) // "") else . end' \
              <<<"$manifest")"
            if [[ -z "$notes" ]]; then
              echo "::error::$package has empty manifest release notes"
              exit 1
            fi
            if [[ -z "$release_notes" ]]; then
              release_notes="$notes"
            elif [[ "$notes" != "$release_notes" ]]; then
              echo "::error::Package manifests contain inconsistent release notes"
              exit 1
            fi
          done

          sha256sum "${expected[@]}" > SHA256SUMS
          {
            echo "## What's Changed"
            echo
            printf '%s\n' "$release_notes"
            echo
            echo "## SHA256 Hashes"
            echo '```text'
            cat SHA256SUMS
            echo '```'
          } > release-notes.md

      - name: Create GitHub prerelease
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::GitHub release $RELEASE_TAG already exists"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --prerelease \
            --title "1.0.0:9" \
            --notes-file release-assets/release-notes.md \
            release-assets/pyblock-blake2b-supplier_aarch64.s9pk \
            release-assets/pyblock-blake2b-supplier_x86_64.s9pk \
            release-assets/SHA256SUMS
